name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install schema validator
        run: python -m pip install jsonschema==4.26.0
      - name: Verify repo invariants
        run: bash check-consistency.sh
